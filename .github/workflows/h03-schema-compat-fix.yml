name: H03 schema compatibility fix

on:
  push:
    branches:
      - agent/t2-h03-generic-runtime-routing

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/t2-h03-generic-runtime-routing
          fetch-depth: 0
      - name: Verify and extract corrected readers
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/h03-fix/0* | base64 -d > /tmp/h03-fix.tgz
          printf '%s  %s\n' \
            '54870100677381010f3384a66ba93ad54eeac653ac4f8fe33f29a69f69590ae0' \
            '/tmp/h03-fix.tgz' | sha256sum --check --strict
          tar -xzf /tmp/h03-fix.tgz
          rm -rf tmp/h03-fix
      - name: Publish compatibility correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src tmp
          git commit -m 'fix: preserve legacy registry schemas with configuration routing [skip ci]'
          git push origin HEAD:agent/t2-h03-generic-runtime-routing
