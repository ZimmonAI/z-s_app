name: 2B-07 bounded legacy workflow compatibility

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply bounded compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/2b-06-dual-provider-media-validation.yml')
          text = path.read_text()
          old_version = "manifest.version !== '0.4.0'"
          old_suffix = ' -- db/migrations db/seeds'
          new_suffix = ''' -- \\
            db/migrations/0001_z_s_control_plane_foundation.sql \\
            db/migrations/0001_z_s_control_plane_foundation.down.sql \\
            db/migrations/0002_z_s_runtime_registry.sql \\
            db/migrations/0002_z_s_runtime_registry.down.sql \\
            db/seeds'''
          if old_version not in text:
              raise SystemExit('2b06-version-guard-not-found')
          if text.count(old_suffix) != 1:
              raise SystemExit('2b06-migration-guard-not-unique')
          text = text.replace(old_version, "manifest.version !== '0.5.0'", 1)
          text = text.replace(old_suffix, new_suffix, 1)
          path.write_text(text)
          PY
          rm .github/workflows/2b-07-compatibility-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep 2B-06 validation compatible with 2B-07'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
