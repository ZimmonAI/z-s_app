name: H03 finalize source branch

on:
  push:
    branches:
      - agent/t2-h03-generic-runtime-routing

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[h03-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/t2-h03-generic-runtime-routing
          fetch-depth: 0
      - name: Apply verified compatibility delta if needed
        shell: bash
        run: |
          set -euo pipefail
          cat <<'PATCH' | base64 -d | gzip -d > /tmp/h03-compat.patch
          
          PATCH
          if git apply --check /tmp/h03-compat.patch; then
            git apply /tmp/h03-compat.patch
          elif git apply --reverse --check /tmp/h03-compat.patch; then
            echo 'compatibility delta already applied'
          else
            echo 'compatibility delta does not match branch state' >&2
            exit 1
          fi
      - name: Restore permanent validation and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/t2-h03-generic-runtime-routing-validation.yml <<'WORKFLOW'
          name: T2 H03 generic runtime routing validation

          on:
            pull_request:
              paths:
                - '.github/workflows/t2-h03-generic-runtime-routing-validation.yml'
                - 'db/migrations/0010_z_s_runtime_configuration_routing.sql'
                - 'db/migrations/0010_z_s_runtime_configuration_routing.down.sql'
                - 'package.json'
                - 'scripts/validate-runtime-configuration-routing.mjs'
                - 'scripts/verify-package-artifact.mjs'
                - 'src/client-storage-configuration*.ts'
                - 'src/runtime-active-configuration.ts'
                - 'src/runtime-integration-token-auth.ts'
                - 'src/runtime-contract.ts'
                - 'src/runtime-service.ts'
                - 'src/runtime-ingest.ts'
                - 'src/runtime-local-composition.ts'
                - 'src/runtime-storage-registry*.ts'
                - 'src/runtime-dual-provider.ts'
                - 'src/runtime-s3-provider.ts'
                - 'src/runtime-read-delivery.ts'
                - 'src/runtime-read-grant.ts'
                - 'tests/runtime-active-configuration.test.ts'
                - 'tests/runtime-integration-token-auth.test.ts'
                - 'tests/runtime-configured-provider.test.ts'
                - 'tests/runtime-configured-read-delivery.test.ts'
                - 'tests/runtime-configuration-routing-migration.test.ts'
                - 'tests/runtime-configuration-routing.integration.test.ts'
            push:
              branches:
                - agent/t2-h03-generic-runtime-routing

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              services:
                postgres:
                  image: postgres:17
                  env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: z_s_test
                  ports:
                    - 5432:5432
                  options: >-
                    --health-cmd "pg_isready -U postgres -d z_s_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: npm install --ignore-scripts
                - name: Focused tests
                  run: npm run test:focused
                - name: Full tests
                  run: npm test
                - name: PostgreSQL registry tests
                  env:
                    TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/z_s_test
                  run: npm run test:registry
                - name: Typecheck
                  run: npm run typecheck
                - name: Lint
                  run: npm run lint
                - name: Build
                  run: npm run build
                - name: Package install smoke
                  run: npm run pack:check
                - name: Package artifact verification
                  run: npm run package:verify
                - name: Migration validation
                  run: npm run validate:migration
                - name: Seed validation
                  run: npm run validate:seed
                - name: Secret scan
                  run: npm run validate:secrets
                - name: Legacy identifier validation
                  run: npm run validate:legacy-id
                - name: Complete validation chain
                  run: npm run validate
          WORKFLOW
          rm -f .github/workflows/h03-refresh-export.yml
          rm -f .github/workflows/h03-apply-delta.yml
          rm -f .github/workflows/h03-schema-compat-fix.yml
          rm -f .github/workflows/h03-finalize.yml
          rm -f tmp/h03-refresh-run-id.txt
          rm -rf tmp/h03-fix
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: finalize H03 routing branch [h03-finalized]'
          git push origin HEAD:agent/t2-h03-generic-runtime-routing
