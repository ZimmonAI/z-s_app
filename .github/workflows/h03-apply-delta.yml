name: H03 apply verified delta

on:
  push:
    branches:
      - agent/t2-h03-generic-runtime-routing

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[h03-delta-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/t2-h03-generic-runtime-routing
          fetch-depth: 0
      - name: Apply verified local delta
        shell: bash
        run: |
          set -euo pipefail
          cat <<'PATCH' | base64 -d | gzip -d > /tmp/h03-delta.patch
          
          PATCH
          git apply --index /tmp/h03-delta.patch
          rm -f tmp/h03-refresh-run-id.txt .github/workflows/h03-apply-delta.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: complete H03 authority and validation [h03-delta-applied]'
          git push origin HEAD:agent/t2-h03-generic-runtime-routing
