name: 2B-07 read grant and delivery validation

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - README.md
      - docs/runtime-contract.md
      - src/index.ts
      - src/runtime-contract.ts
      - src/runtime-read-grant.ts
      - src/runtime-read-delivery.ts
      - tests/runtime-read-grant.test.ts
      - tests/runtime-read-delivery.test.ts
      - db/migrations/0003_z_s_read_delivery.sql
      - db/migrations/0003_z_s_read_delivery.down.sql
      - scripts/install-smoke.mjs
      - scripts/local-readiness.mjs
      - scripts/validate-migration.mjs
      - scripts/verify-package-artifact.mjs
      - .github/workflows/2b-07-read-delivery-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: z_s_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d z_s_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/z_s_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/z_s_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Cast revoke-transition SQL parameters
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/runtime-read-grant.ts')
          source = path.read_text(encoding='utf-8')
          start = source.index('  async revoke(')
          end = source.index('\n  async getForDelivery(', start)
          block = source[start:end]
          replacements = [
              ('              SET state = $2,', '              SET state = $2::text,'),
              ("                  revoked_at = CASE WHEN $2 = 'revoked' THEN $3 ELSE NULL END,", "                  revoked_at = CASE WHEN $2::text = 'revoked' THEN $3::timestamptz ELSE NULL END,"),
              ('                  updated_at = $3,', '                  updated_at = $3::timestamptz,'),
              ('            WHERE object_read_grant_id = $1', '            WHERE object_read_grant_id = $1::uuid'),
              ('              AND row_version = $4`', '              AND row_version = $4::integer`'),
          ]
          changed = 0
          for old, new in replacements:
              count = block.count(old)
              if count == 1:
                  block = block.replace(old, new, 1)
                  changed += 1
              elif count == 0 and new in block:
                  continue
              else:
                  raise SystemExit(f'unexpected scoped replacement count {count} for {old!r}')
          if changed:
              path.write_text(source[:start] + block + source[end:], encoding='utf-8')
          PY
          if ! git diff --quiet -- src/runtime-read-grant.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/runtime-read-grant.ts
            git commit -m 'fix: cast revoke transition SQL parameters'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify frozen source baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          baseline=d13e74fb428cec20f1706034ed0e00274ee9fce2
          test "$(git merge-base "$baseline" HEAD)" = "$baseline"

      - name: Verify package and lock authority
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = { '@aws-sdk/client-s3': '3.1088.0' };
          if (manifest.name !== '@zimmonai/z-s-control-plane' || manifest.version !== '0.5.0') {
            throw new Error('unexpected-package-identity');
          }
          if (JSON.stringify(manifest.dependencies) !== JSON.stringify(expected)) {
            throw new Error('unexpected-direct-runtime-dependencies');
          }
          if (lock.lockfileVersion !== 3) throw new Error('unexpected-lockfile-version');
          const root = lock.packages?.[''];
          if (root?.name !== manifest.name || root?.version !== manifest.version) {
            throw new Error('unexpected-lock-root');
          }
          if (JSON.stringify(root.dependencies) !== JSON.stringify(expected)) {
            throw new Error('unexpected-lock-root-dependencies');
          }
          const serialized = JSON.stringify(lock);
          if (/_authToken|file:|workspace:|link:|git\+|github\.com.*#/i.test(serialized)) {
            throw new Error('prohibited-lock-source');
          }
          NODE

      - name: Install dependencies cleanly
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify inherited schema and seeds are unchanged
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --exit-code "$base...$head" -- \
            db/migrations/0001_z_s_control_plane_foundation.sql \
            db/migrations/0001_z_s_control_plane_foundation.down.sql \
            db/migrations/0002_z_s_runtime_registry.sql \
            db/migrations/0002_z_s_runtime_registry.down.sql \
            db/seeds

      - name: Validate reviewed 0003 artifacts
        run: npm run validate:migration

      - name: Run focused read-grant and delivery tests
        id: focused_read_tests
        continue-on-error: true
        shell: bash
        run: npm run test:read > /tmp/2b07-read-tests.log 2>&1

      - name: Upload focused-test diagnostics
        if: steps.focused_read_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: 2b07-read-tests-${{ github.run_id }}
          path: /tmp/2b07-read-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce focused-test result
        if: steps.focused_read_tests.outcome == 'failure'
        run: exit 1

      - name: Run PostgreSQL registry tests
        run: npm run test:registry

      - name: Run full validation chain
        run: npm run validate

      - name: Build and create package metadata
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm pack --json --silent > /tmp/z-s-pack.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packed = JSON.parse(fs.readFileSync('/tmp/z-s-pack.json', 'utf8'));
          if (!Array.isArray(packed) || packed.length !== 1 || packed[0]?.version !== '0.5.0') {
            throw new Error('unexpected-package-artifact');
          }
          NODE
