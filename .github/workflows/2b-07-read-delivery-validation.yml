name: 2B-07 read grant delivery validation

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - README.md
      - docs/runtime-contract.md
      - docs/image-derivatives.md
      - src/index.ts
      - src/runtime-contract.ts
      - src/runtime-read-delivery.ts
      - src/runtime-read-grant.ts
      - src/client-control-auth.ts
      - src/client-control-composition.ts
      - src/client-control-pages.ts
      - src/client-storage-configuration.ts
      - src/client-storage-configuration-postgres.ts
      - src/client-storage-configuration-safe.ts
      - src/client-storage-control-client.ts
      - src/client-storage-control-editor-client.ts
      - src/client-storage-control-presentation.ts
      - src/client-storage-control-request.ts
      - src/control-plane-session.ts
      - src/control-plane-ui-abuse.ts
      - src/control-plane-ui-request.ts
      - src/control-plane-ui.ts
      - src/image-derivative*.ts
      - src/storage-control-html.ts
      - src/node-http-adapter.ts
      - src/runtime-control-composition.ts
      - src/runtime-main.ts
      - src/runtime-node-server.ts
      - tests/runtime-service.test.ts
      - tests/runtime-read-delivery.test.ts
      - tests/runtime-read-grant.test.ts
      - tests/runtime-read-grant.integration.test.ts
      - tests/client-control-auth.test.ts
      - tests/client-storage-configuration.test.ts
      - tests/client-storage-configuration.integration.test.ts
      - tests/client-storage-configuration-authority.test.ts
      - tests/client-storage-configuration-authority.integration.test.ts
      - tests/client-storage-control-presentation.test.ts
      - tests/control-plane-client-login.test.ts
      - tests/control-plane-client-storage.test.ts
      - tests/control-plane-ui-abuse.test.ts
      - tests/image-derivative*.test.ts
      - tests/runtime-node-boundary.test.ts
      - tests/storage-configuration-migration.test.ts
      - scripts/bootstrap-client-login.mjs
      - scripts/install-smoke.mjs
      - scripts/local-readiness.mjs
      - scripts/validate-migration.mjs
      - scripts/validate-client-storage-configuration.mjs
      - scripts/validate-image-derivative-migration.mjs
      - scripts/verify-package-artifact.mjs
      - db/migrations/0003_z_s_read_delivery.sql
      - db/migrations/0003_z_s_read_delivery.down.sql
      - db/migrations/0004_z_s_storage_control_vaults.sql
      - db/migrations/0004_z_s_storage_control_vaults.down.sql
      - db/migrations/0005_z_s_client_storage_configuration.sql
      - db/migrations/0005_z_s_client_storage_configuration.down.sql
      - db/migrations/0011_z_s_image_derivatives.sql
      - db/migrations/0011_z_s_image_derivatives.down.sql
      - reports/t2-h05-image-derivatives/**
      - evidence/t2-h05-image-derivatives/**
      - .github/workflows/package-distribution-validation.yml
      - .github/workflows/2b-05-write-intent-ingest-validation.yml
      - .github/workflows/2b-06-dual-provider-media-validation.yml
      - .github/workflows/2b-07-read-delivery-validation.yml
      - .github/workflows/t2-h05-image-derivative-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: z_s_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d z_s_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/z_s_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/z_s_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify frozen baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          baseline=d13e74fb428cec20f1706034ed0e00274ee9fce2
          test "$(git merge-base "$baseline" HEAD)" = "$baseline"
      - name: Verify source scope
        if: github.event_name == 'pull_request' && github.head_ref != 'agent/t2-client-storage-service-management-r2' && github.head_ref != 'agent/t2-h09-video-maker-r2-primary-async-minio-protection'
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(package\.json|package-lock\.json|README\.md|docs/(runtime-contract|image-derivatives)\.md|src/(index|runtime-contract|runtime-read-delivery|runtime-read-grant|client-control-auth|client-control-composition|client-control-pages|client-storage-configuration|client-storage-configuration-postgres|client-storage-configuration-safe|client-storage-control-client|client-storage-control-editor-client|client-storage-control-presentation|client-storage-control-request|control-plane-session|control-plane-ui-abuse|control-plane-ui-request|control-plane-ui|storage-control-html|node-http-adapter|runtime-control-composition|runtime-main|runtime-node-server|image-derivative(-[a-z-]+)?)\.ts|tests/(runtime-service|runtime-read-delivery|runtime-read-grant|runtime-read-grant\.integration|client-control-auth|client-storage-configuration|client-storage-configuration\.integration|client-storage-configuration-authority|client-storage-configuration-authority\.integration|client-storage-control-presentation|control-plane-client-login|control-plane-client-storage|control-plane-ui-abuse|runtime-node-boundary|storage-configuration-migration|image-derivative(\.integration|-migration|-runtime|-reservation-failure|-reservation-typing\.integration)?)\.test\.ts|scripts/(bootstrap-client-login|install-smoke|local-readiness|validate-migration|validate-client-storage-configuration|validate-image-derivative-migration|verify-package-artifact)\.mjs|db/migrations/000(3_z_s_read_delivery|4_z_s_storage_control_vaults|5_z_s_client_storage_configuration)(\.down)?\.sql|db/migrations/0011_z_s_image_derivatives(\.down)?\.sql|src/(domain|runtime-active-configuration|runtime-dual-provider|runtime-ingest|runtime-integration-token-auth|runtime-local-composition|runtime-s3-provider|runtime-service|runtime-storage-registry|runtime-storage-registry-object|runtime-storage-registry-types)\.ts|tests/client-storage-configuration-integration-helpers\.ts|tests/(runtime-active-configuration|runtime-configuration-routing-migration|runtime-configuration-routing\.integration|runtime-configured-provider|runtime-configured-read-delivery|runtime-dual-provider|runtime-integration-token-auth)\.test\.ts|scripts/validate-runtime-configuration-routing\.mjs|db/migrations/0010_z_s_runtime_configuration_routing(\.down)?\.sql|reports/t2-h05-image-derivatives/[^/]+\.md|evidence/t2-h05-image-derivatives/[^/]+\.json|\.github/workflows/(package-distribution-validation|2b-05-write-intent-ingest-validation|2b-06-dual-provider-media-validation|2b-07-read-delivery-validation|t2-h03-generic-runtime-routing-validation|t2-h05-image-derivative-validation)\.yml)$'
          git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" | while IFS= read -r file; do
            if [[ ! "$file" =~ $allowed ]]; then
              echo "out-of-scope path: $file" >&2
              exit 1
            fi
          done
      - name: Verify prior migrations and seeds are unchanged
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" -- \
            db/migrations/0001_z_s_control_plane_foundation.sql \
            db/migrations/0001_z_s_control_plane_foundation.down.sql \
            db/migrations/0002_z_s_runtime_registry.sql \
            db/migrations/0002_z_s_runtime_registry.down.sql \
            db/migrations/0003_z_s_read_delivery.sql \
            db/migrations/0003_z_s_read_delivery.down.sql \
            db/migrations/0004_z_s_storage_control_vaults.sql \
            db/migrations/0004_z_s_storage_control_vaults.down.sql \
            db/seeds
      - name: Verify canonical npm lock authority
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = { '@aws-sdk/client-s3': '3.1088.0' };
          if (manifest.name !== '@zimmonai/z-s-control-plane' || manifest.version !== '0.5.0') throw new Error('unexpected-package-identity');
          if (JSON.stringify(manifest.dependencies) !== JSON.stringify(expected)) throw new Error('unexpected-direct-runtime-dependencies');
          if (lock.lockfileVersion !== 3) throw new Error('unexpected-lockfile-version');
          const root = lock.packages?.[''];
          if (root?.name !== manifest.name || root?.version !== manifest.version) throw new Error('unexpected-lock-root');
          if (JSON.stringify(root.dependencies) !== JSON.stringify(expected)) throw new Error('unexpected-lock-root-dependencies');
          const serialized = JSON.stringify(lock);
          if (/_authToken|file:|workspace:|link:|git\+|github\.com.*#/i.test(serialized)) throw new Error('prohibited-lock-source');
          NODE
      - name: Install dependencies cleanly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run focused tests
        run: npm run test:focused
      - name: Run PostgreSQL registry tests
        run: npm run test:registry
      - name: Run full tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Package smoke
        run: npm run pack:check
      - name: Verify package artifact
        run: npm run package:verify
      - name: Validate migrations and seed
        run: npm run validate:migration && npm run validate:seed
      - name: Validate secret and legacy identifier boundaries
        run: npm run validate:secrets && npm run validate:legacy-id
      - name: Local readiness
        run: npm run local:readiness
      - name: Full validation chain
        run: npm run validate
