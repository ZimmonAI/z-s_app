name: H07 completion patch

on:
  pull_request:
    paths:
      - '.github/h07-fix/**'
      - '.github/workflows/h07-completion-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/t2-client-storage-service-management-r2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: z_s_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d z_s_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/z_s_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/z_s_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/t2-client-storage-service-management-r2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic source patch
        run: node .github/h07-fix/apply.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate focused source and security boundaries
        run: >-
          npm run test:storage-services &&
          npm run typecheck &&
          npm run lint &&
          npm run validate:secrets
      - name: Validate full PostgreSQL-backed suite serially
        run: npm test
      - name: Commit completed source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/h07-fix .github/workflows/h07-completion-patch.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete H07 runtime and validation wiring'
          git pull --rebase origin agent/t2-client-storage-service-management-r2
          git push origin HEAD:agent/t2-client-storage-service-management-r2
