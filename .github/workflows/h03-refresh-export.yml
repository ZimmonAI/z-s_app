name: H03 refresh export

on:
  push:
    branches:
      - agent/t2-h03-generic-runtime-routing

permissions:
  contents: write

jobs:
  export:
    if: ${{ !contains(github.event.head_commit.message, '[skip-export]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/t2-h03-generic-runtime-routing
      - name: Archive current PR head
        run: tar --exclude=.git --exclude=tmp/h03-refresh-run-id.txt -czf /tmp/z-s-h03-current.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: z-s-h03-current
          path: /tmp/z-s-h03-current.tgz
          retention-days: 1
      - name: Record run id
        run: |
          mkdir -p tmp
          printf '%s\n' '${{ github.run_id }}' > tmp/h03-refresh-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/h03-refresh-run-id.txt
          git commit -m 'chore: record H03 refresh run [skip-export]'
          git push origin HEAD:agent/t2-h03-generic-runtime-routing
