name: T2 H03 generic runtime routing validation

on:
  pull_request:
    paths:
      - '.github/workflows/t2-h03-generic-runtime-routing-validation.yml'
      - 'db/migrations/0010_z_s_runtime_configuration_routing.sql'
      - 'db/migrations/0010_z_s_runtime_configuration_routing.down.sql'
      - 'package.json'
      - 'scripts/validate-runtime-configuration-routing.mjs'
      - 'scripts/verify-package-artifact.mjs'
      - 'src/client-storage-configuration*.ts'
      - 'src/runtime-active-configuration.ts'
      - 'src/runtime-integration-token-auth.ts'
      - 'src/runtime-contract.ts'
      - 'src/runtime-service.ts'
      - 'src/runtime-ingest.ts'
      - 'src/runtime-local-composition.ts'
      - 'src/runtime-storage-registry*.ts'
      - 'src/runtime-dual-provider.ts'
      - 'src/runtime-s3-provider.ts'
      - 'src/runtime-read-delivery.ts'
      - 'src/runtime-read-grant.ts'
      - 'tests/runtime-active-configuration.test.ts'
      - 'tests/runtime-integration-token-auth.test.ts'
      - 'tests/runtime-configured-provider.test.ts'
      - 'tests/runtime-configured-read-delivery.test.ts'
      - 'tests/runtime-configuration-routing-migration.test.ts'
      - 'tests/runtime-configuration-routing.integration.test.ts'
  push:
    branches:
      - agent/t2-h03-generic-runtime-routing

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: z_s_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d z_s_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Focused tests
        run: npm run test:focused
      - name: Full tests
        run: npm test
      - name: PostgreSQL registry tests
        id: registry
        continue-on-error: true
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/z_s_test
        shell: bash
        run: |
          set -o pipefail
          npm run test:registry 2>&1 | tee h03-registry-test.log
      - name: Upload PostgreSQL registry log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h03-registry-test-log
          path: h03-registry-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce PostgreSQL registry result
        if: steps.registry.outcome != 'success'
        run: exit 1
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Package install smoke
        run: npm run pack:check
      - name: Package artifact verification
        run: npm run package:verify
      - name: Migration validation
        run: npm run validate:migration
      - name: Seed validation
        run: npm run validate:seed
      - name: Secret scan
        run: npm run validate:secrets
      - name: Legacy identifier validation
        run: npm run validate:legacy-id
      - name: Complete validation chain
        run: npm run validate
