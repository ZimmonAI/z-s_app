name: T2 H03 diagnose schema compatibility payload

on:
  pull_request:
    paths:
      - '.github/workflows/t2-h03-generic-runtime-routing-validation.yml'
      - 'tmp/h03-fix/**'

permissions:
  contents: read

jobs:
  diagnose-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/t2-h03-generic-runtime-routing
          fetch-depth: 0
      - name: Print staged payload integrity
        shell: bash
        run: |
          set -euo pipefail
          wc -c tmp/h03-fix/0*
          sha256sum tmp/h03-fix/0*
