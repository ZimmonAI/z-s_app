name: 2B-07 README contract synchronization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Synchronize package and route documentation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          replacements = {
              'The current source identity is `@zimmonai/z-s-control-plane@0.4.0`. Contract `1.0` and Node.js `>=22` remain unchanged. The existing root, `runtime-contract`, `runtime-service`, and `runtime-storage-registry` package entry points are preserved; no additional package subpath is introduced.':
              'The current source identity is `@zimmonai/z-s-control-plane@0.5.0`. Contract `1.0` and Node.js `>=22` remain unchanged. The existing package entry points remain available, with additive `runtime-read-grant` and `runtime-read-delivery` subpaths for the governed server runtime.',
              'Version `0.4.0` is a source implementation target only.':
              'Version `0.5.0` is a source implementation target only.',
              'The in-process runtime recognizes exactly:':
              'The in-process runtime recognizes:',
              'DELETE /v1/object-write-intents/{objectWriteIntentId}\n```':
              'DELETE /v1/object-write-intents/{objectWriteIntentId}\nPOST   /v1/object-read-grants\nDELETE /v1/object-read-grants/{objectReadGrantId}\nGET    /v1/storage-objects/{storageObjectId}/content\nHEAD   /v1/storage-objects/{storageObjectId}/content\n```',
              'schema changes, read delivery, technical deletion':
              'future schema changes, technical deletion',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'readme-pattern-not-found: {old[:40]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Synchronize 2B-07 package and route documentation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
