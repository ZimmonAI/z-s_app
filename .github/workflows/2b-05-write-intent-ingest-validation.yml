name: 2B-05 write intent and generic ingest validation

on:
  pull_request:
    paths:
      - package.json
      - README.md
      - docs/runtime-contract.md
      - src/index.ts
      - src/runtime-contract.ts
      - src/runtime-service.ts
      - src/runtime-storage-registry.ts
      - src/runtime-storage-registry-object.ts
      - src/runtime-storage-registry-types.ts
      - src/runtime-ingest.ts
      - src/runtime-upload-token.ts
      - tests/runtime-service.test.ts
      - tests/runtime-storage-registry.integration.test.ts
      - tests/runtime-ingest.test.ts
      - scripts/install-smoke.mjs
      - scripts/local-readiness.mjs
      - .github/workflows/2b-05-write-intent-ingest-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch pull request head quietly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${{ github.event.pull_request.head.sha }}"
          git checkout -q --detach FETCH_HEAD

      - name: Run secret scan only
        run: node scripts/scan-secrets.mjs
