name: 2B-05 write intent and generic ingest validation

on:
  pull_request:
    paths:
      - package.json
      - README.md
      - docs/runtime-contract.md
      - src/index.ts
      - src/runtime-contract.ts
      - src/runtime-service.ts
      - src/runtime-storage-registry.ts
      - src/runtime-storage-registry-object.ts
      - src/runtime-storage-registry-types.ts
      - src/runtime-ingest.ts
      - src/runtime-upload-token.ts
      - tests/runtime-service.test.ts
      - tests/runtime-storage-registry.integration.test.ts
      - tests/runtime-ingest.test.ts
      - scripts/install-smoke.mjs
      - scripts/local-readiness.mjs
      - .github/workflows/2b-05-write-intent-ingest-validation.yml

permissions:
  contents: write

jobs:
  patch-read-grant-revocation:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Cast revocation SQL parameters
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('src/runtime-read-grant.ts')
          text = path.read_text()
          old = """SET state = $2, revoked_at = CASE WHEN $2 = 'revoked' THEN $3 ELSE NULL END,
                 updated_at = $3, row_version = row_version + 1"""
          new = """SET state = $2::text,
                 revoked_at = CASE WHEN $2::text = 'revoked' THEN $3::timestamptz ELSE NULL::timestamptz END,
                 updated_at = $3::timestamptz, row_version = row_version + 1"""
          if text.count(old) != 1:
              raise SystemExit('revocation-update-not-found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime-read-grant.ts
          git commit -m 'Cast read grant revocation SQL parameters'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: z_s_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d z_s_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/z_s_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/z_s_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Verify prior migrations and seeds are unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" -- \
            db/migrations/0001_z_s_control_plane_foundation.sql \
            db/migrations/0001_z_s_control_plane_foundation.down.sql \
            db/migrations/0002_z_s_runtime_registry.sql \
            db/migrations/0002_z_s_runtime_registry.down.sql \
            db/seeds
      - name: Run focused ingest tests
        run: npm run test:focused
      - name: Run PostgreSQL registry tests
        run: npm run test:registry
      - name: Run full validation
        run: npm run validate
