name: 2B-05 write intent and generic ingest validation

on:
  pull_request:
    paths:
      - package.json
      - README.md
      - docs/runtime-contract.md
      - src/index.ts
      - src/runtime-contract.ts
      - src/runtime-service.ts
      - src/runtime-storage-registry.ts
      - src/runtime-storage-registry-object.ts
      - src/runtime-storage-registry-types.ts
      - src/runtime-ingest.ts
      - src/runtime-upload-token.ts
      - tests/runtime-service.test.ts
      - tests/runtime-storage-registry.integration.test.ts
      - tests/runtime-ingest.test.ts
      - scripts/install-smoke.mjs
      - scripts/local-readiness.mjs
      - .github/workflows/2b-05-write-intent-ingest-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out pull request head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${{ github.event.pull_request.head.sha }}"
          git checkout -q --detach FETCH_HEAD

      - name: Apply focused compile repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          registry_path = Path('src/runtime-storage-registry.ts')
          registry = registry_path.read_text(encoding='utf-8')
          replacements = [
              (
                  "  type DurableDuplicateResultCodec,\n  type ProviderAttemptInput,",
                  "  type DurableDuplicateResultCodec,\n  type DurableDuplicateResultReference,\n  type PostgresQueryable,\n  type ProviderAttemptInput,",
              ),
              (
                  "    async encode(value, _client) {",
                  "    async encode(value: unknown, _client: PostgresQueryable) {",
              ),
              (
                  "    async decode(reference, client) {",
                  "    async decode(reference: DurableDuplicateResultReference, client: PostgresQueryable) {",
              ),
          ]
          for old, new in replacements:
              if old not in registry:
                  raise SystemExit(f'registry repair target missing: {old!r}')
              registry = registry.replace(old, new, 1)
          registry_path.write_text(registry, encoding='utf-8')

          test_path = Path('tests/runtime-ingest.test.ts')
          test = test_path.read_text(encoding='utf-8')
          replacements = [
              ("      body: input.bytes,", "      body: Uint8Array.from(input.bytes).buffer,"),
              (
                  "    service.verify(first, { ...claims, objectWriteIntentId: nextUuid() }),",
                  "    async () => service.verify(first, { ...claims, objectWriteIntentId: nextUuid() }),",
              ),
              (
                  "    service.verify(first, { ...claims, storageObjectId: nextUuid() }),",
                  "    async () => service.verify(first, { ...claims, storageObjectId: nextUuid() }),",
              ),
              (
                  "    service.verify(first, { ...claims, callerAppId: 'z-x_app' }),",
                  "    async () => service.verify(first, { ...claims, callerAppId: 'z-x_app' }),",
              ),
              (
                  "  await assert.rejects(service.verify(tampered, claims), /invalid-upload-completion-token/);",
                  "  await assert.rejects(\n    async () => service.verify(tampered, claims),\n    /invalid-upload-completion-token/,\n  );",
              ),
              (
                  "  await assert.rejects(service.verify(first, claims), /upload-completion-token-expired/);",
                  "  await assert.rejects(\n    async () => service.verify(first, claims),\n    /upload-completion-token-expired/,\n  );",
              ),
          ]
          for old, new in replacements:
              if old not in test:
                  raise SystemExit(f'test repair target missing: {old!r}')
              test = test.replace(old, new, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime-storage-registry.ts tests/runtime-ingest.test.ts
          git commit -m "Fix focused ingest compilation"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Install dependencies quietly
        run: npm install --ignore-scripts --silent

      - name: Run focused ingest tests
        run: npm run test:focused
