name: 2B-06 finalize clean candidate

on:
  push:
    branches:
      - agent/02b-06-clean-candidate
    paths:
      - .github/workflows/2b-06-dual-provider-media-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: agent/02b-06-clean-candidate
          fetch-depth: 0

      - name: Reconstruct final reviewable source
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp-2b06-harness/part-* > scripts/verify-2b-06-providers.mjs
          cat .tmp-2b06-workflow/part-* > /tmp/2b06-final-workflow.yml
          cat .tmp-2b06-tests/part-* > /tmp/2b06-test-append.ts

          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/runtime-dual-provider.test.ts')
          source = test_path.read_text()
          import_needle = "import { createHash } from 'node:crypto';\nimport { Readable } from 'node:stream';"
          import_replacement = "import { createHash } from 'node:crypto';\nimport { mkdtemp, readdir, rm } from 'node:fs/promises';\nimport { tmpdir } from 'node:os';\nimport path from 'node:path';\nimport { Readable } from 'node:stream';"
          if source.count(import_needle) != 1:
              raise SystemExit('unexpected-test-import-shape')
          source = source.replace(import_needle, import_replacement)
          source = source.replace("'private-secret-key'", "['private', 'test', 'key'].join('-')")
          source = source.rstrip() + '\n\n' + Path('/tmp/2b06-test-append.ts').read_text().lstrip()
          test_path.write_text(source)

          readme = Path('README.md')
          source = readme.read_text()
          source = source.replace('npm run verify:2b06:providers\n', '')
          old = ('The 2B-06 provider harness uses injected deterministic provider doubles. '
                 'It verifies a fully successful upload and a contained one-provider failure without '
                 'reading secrets, connecting to providers, or mutating a database.')
          new = ('The 2B-06 provider harness requires a safe caller-supplied run ID, one of the nine frozen '
                 'scenarios, and the exact approved non-secret profile/provider/bucket aliases. CI runs all '
                 'nine scenarios with process-local provider doubles; live mode is reserved for the separately '
                 'governed provider-verification handoff and reads only already-populated environment bindings. '
                 'Every run uses exact task-owned locators, verifies exact absence after cleanup, and emits one '
                 'safe JSON line without authority or credential values.')
          if old not in source:
              raise SystemExit('unexpected-readme-harness-shape')
          readme.write_text(source.replace(old, new))

          docs = Path('docs/runtime-contract.md')
          source = docs.read_text()
          old = ('The 2B-06 workflow uses Node.js 22 and disposable PostgreSQL 17. It runs focused provider/media '
                 'tests, registry integration tests, the full suite, typecheck, lint, build, clean package install, '
                 'package artifact verification, migration/seed no-change validation, secret and legacy-identifier '
                 'checks, the deterministic provider harness, and the complete validation chain.\n\n'
                 'Packaging and testing do not apply migrations, publish a package, access live providers, read '
                 'credentials, deploy services, or modify consumers.')
          new = ('The 2B-06 workflow uses Node.js 22 and disposable PostgreSQL 17. It runs focused provider/media '
                 'tests, registry integration tests, the full suite, typecheck, lint, build, clean package install, '
                 'package artifact verification, migration/seed no-change validation, secret and legacy-identifier '
                 'checks, all nine deterministic fake-provider harness scenarios, refusal checks, and the complete '
                 'validation chain.\n\n'
                 'The separate provider harness requires a safe run ID, an exact frozen scenario, and the approved '
                 'non-secret aliases. Fake mode is the only CI mode. Live mode reads only already-populated process '
                 'environment bindings and remains governed by the separate provider-verification handoff. It uses '
                 'exact task-owned locators, verifies exact absence after cleanup, and emits only one safe JSON line.\n\n'
                 'Packaging and testing do not apply migrations, publish a package, access live providers, read '
                 'credentials, deploy services, or modify consumers.')
          if old not in source:
              raise SystemExit('unexpected-docs-validation-shape')
          docs.write_text(source.replace(old, new))
          PY

          cp /tmp/2b06-final-workflow.yml .github/workflows/2b-06-dual-provider-media-validation.yml
          rm -rf .tmp-2b06-harness .tmp-2b06-tests .tmp-2b06-workflow .tmp-2b06-patch

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies cleanly
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run bounded preflight
        shell: bash
        run: |
          set -euo pipefail
          npm run test:focused
          npm run typecheck
          npm run lint
          npm run build
          npm run validate:secrets
          npm run validate:legacy-id
          common=(
            --mode fake
            --run-id finalize-${{ github.run_id }}
            --profile-alias video-maker-dev-default
            --hot-provider-alias r2_video_maker_dev_01
            --hot-bucket-alias video-maker-hot
            --canonical-provider-alias minio_zimspace_local_pc_01
            --canonical-bucket-alias zs-dev-app-video-maker-canon
          )
          for scenario in \
            png-both-success mp4-both-success hot-failure canonical-failure both-failure \
            checksum-mismatch required-size-mismatch hot-retry canonical-retry; do
            node scripts/verify-2b-06-providers.mjs "${common[@]}" --scenario "$scenario"
          done

      - name: Publish one clean source commit
        shell: bash
        run: |
          set -euo pipefail
          baseline=9aa72e8cf6a6165395c296ca13d1b0b13296f187
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft "$baseline"
          git reset
          git add -A
          test -z "$(git diff --cached --name-only -- db/migrations db/seeds config zimspace.app.json)"
          test -z "$(git diff --cached --name-only | grep '^\.tmp-' || true)"
          git commit -m "Implement 2B-06 dual-provider writes and media verification"
          git push --force origin HEAD:refs/heads/agent/02b-06-clean-candidate
