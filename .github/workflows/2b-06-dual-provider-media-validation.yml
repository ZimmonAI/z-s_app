name: 2B-06 dual-provider media validation

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - README.md
      - docs/runtime-contract.md
      - src/domain.ts
      - src/index.ts
      - src/integrity.ts
      - src/runtime-contract.ts
      - src/runtime-ingest.ts
      - src/runtime-service.ts
      - src/runtime-storage-registry.ts
      - src/runtime-storage-registry-object.ts
      - src/runtime-storage-registry-types.ts
      - src/runtime-dual-provider.ts
      - src/runtime-media-verification.ts
      - src/runtime-s3-provider.ts
      - tests/integrity.test.ts
      - tests/runtime-ingest.test.ts
      - tests/runtime-service.test.ts
      - tests/runtime-storage-registry.integration.test.ts
      - tests/runtime-dual-provider.test.ts
      - tests/runtime-media-verification.test.ts
      - scripts/install-smoke.mjs
      - scripts/local-readiness.mjs
      - scripts/verify-package-artifact.mjs
      - scripts/verify-2b-06-providers.mjs
      - .github/workflows/2b-06-dual-provider-media-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: z_s_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d z_s_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/z_s_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/z_s_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify frozen baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          baseline=9aa72e8cf6a6165395c296ca13d1b0b13296f187
          test "$(git merge-base "$baseline" HEAD)" = "$baseline"

      - name: Verify canonical npm lock authority
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = { '@aws-sdk/client-s3': '3.1088.0' };
          if (manifest.name !== '@zimmonai/z-s-control-plane' || manifest.version !== '0.4.0') {
            throw new Error('unexpected-package-identity');
          }
          if (JSON.stringify(manifest.dependencies) !== JSON.stringify(expected)) {
            throw new Error('unexpected-direct-runtime-dependencies');
          }
          if (lock.lockfileVersion !== 3) throw new Error('unexpected-lockfile-version');
          const root = lock.packages?.[''];
          if (root?.name !== manifest.name || root?.version !== manifest.version) {
            throw new Error('unexpected-lock-root');
          }
          if (JSON.stringify(root.dependencies) !== JSON.stringify(expected)) {
            throw new Error('unexpected-lock-root-dependencies');
          }
          const serialized = JSON.stringify(lock);
          if (/_authToken|file:|workspace:|link:|git\+|github\.com.*#/i.test(serialized)) {
            throw new Error('prohibited-lock-source');
          }
          NODE

      - name: Install dependencies cleanly
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify migrations and seeds are unchanged
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" -- db/migrations db/seeds

      - name: Run focused 2B-06 tests
        run: npm run test:focused

      - name: Run PostgreSQL registry tests
        run: npm run test:registry

      - name: Run full tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package smoke
        run: npm run pack:check

      - name: Verify package artifact
        run: npm run package:verify

      - name: Validate migration and seed
        run: npm run validate:migration && npm run validate:seed

      - name: Validate secret and legacy identifier boundaries
        run: npm run validate:secrets && npm run validate:legacy-id

      - name: Local readiness
        run: npm run local:readiness

      - name: Full validation chain
        run: npm run validate
