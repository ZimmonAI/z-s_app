name: 2B-04 runtime storage registry validation

on:
  pull_request:
    paths:
      - '.github/workflows/2b-04-runtime-storage-registry-validation.yml'
      - 'db/migrations/0002_z_s_runtime_registry.sql'
      - 'db/migrations/0002_z_s_runtime_registry.down.sql'
      - 'docs/02b-04-package-runtime-storage-registry-and-schema.md'
      - 'docs/runtime-storage-registry.md'
      - 'package.json'
      - 'scripts/install-smoke.mjs'
      - 'scripts/validate-migration.mjs'
      - 'src/index.ts'
      - 'src/runtime-storage-registry-duplicate.ts'
      - 'src/runtime-storage-registry-object.ts'
      - 'src/runtime-storage-registry-support.ts'
      - 'src/runtime-storage-registry-types.ts'
      - 'src/runtime-storage-registry.ts'
      - 'tests/runtime-storage-registry.integration.test.ts'
  push:
    branches:
      - agent/02b-04-runtime-storage-registry

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: z_s_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d z_s_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Focused tests
        run: npm run test:focused
      - name: Full tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Package install smoke
        run: npm run pack:check
      - name: Migration static validation
        run: npm run validate:migration
      - name: Seed validation
        run: npm run validate:seed
      - name: Secret scan
        run: npm run validate:secrets
      - name: Legacy identifier validation
        run: npm run validate:legacy-id
      - name: Local readiness
        run: npm run local:readiness
      - name: Complete validation chain
        run: npm run validate
      - name: PostgreSQL runtime registry integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/z_s_test
        run: npm run test:registry
