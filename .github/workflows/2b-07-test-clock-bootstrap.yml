name: 2B-07 deterministic delivery test clock fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Inject the frozen delivery clock and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('tests/runtime-read-delivery.test.ts')
          text = path.read_text()
          reader_pattern = '    providerReader: reader.providerReader,\n  });'
          direct_pattern = '    providerReader,\n  });'
          if text.count(reader_pattern) != 4:
              raise SystemExit('unexpected-reader-coordinator-count')
          if text.count(direct_pattern) != 1:
              raise SystemExit('unexpected-direct-coordinator-count')
          frozen_now = "    now: () => new Date('2026-07-17T00:01:00.000Z'),\n"
          text = text.replace(reader_pattern, '    providerReader: reader.providerReader,\n' + frozen_now + '  });')
          text = text.replace(direct_pattern, '    providerReader,\n' + frozen_now + '  });')
          path.write_text(text)
          PY
          rm .github/workflows/2b-07-test-clock-bootstrap.yml
          rm -f .github/workflows/2b-07-focused-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix deterministic read delivery test clock'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
