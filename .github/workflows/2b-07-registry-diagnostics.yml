name: 2B-07 bounded SQL assembly fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Patch exact SQL assembly boundary
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('src/runtime-read-grant.ts')
          text = path.read_text()
          old = "`${GRANT_SELECT} WHERE grant.object_read_grant_id = $1`"
          new = "`${GRANT_SELECT}\n        WHERE grant.object_read_grant_id = $1`"
          if old not in text:
              raise SystemExit('read-grant-select-boundary-not-found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime-read-grant.ts
          git commit -m 'Fix read grant SELECT assembly'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
