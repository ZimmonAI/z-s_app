name: Temporary T2 clone document patch

on:
  push:
    branches:
      - feature/t2-client-storage-configuration-platform

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/t2-client-storage-configuration-platform
          fetch-depth: 0
      - name: Patch configuration document clone and remove workflow
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('src/client-storage-configuration.ts')
          source = source_path.read_text()
          old = """function cloneDocument(input: Readonly<ConfigurationDraftDocument>): ConfigurationDraftDocument {
            return structuredClone(input) as ConfigurationDraftDocument;
          }
          """
          new = """function cloneDocument(input: Readonly<ConfigurationDraftDocument>): ConfigurationDraftDocument {
            return structuredClone({
              providerConnections: input.providerConnections,
              vaults: input.vaults,
              routes: input.routes,
              imagePresets: input.imagePresets,
            }) as ConfigurationDraftDocument;
          }
          """
          if source.count(old) != 1:
            raise SystemExit('expected cloneDocument implementation not found exactly once')
          source_path.write_text(source.replace(old, new))
          Path('.github/workflows/t2-temp-clone-document-patch.yml').unlink()
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client-storage-configuration.ts .github/workflows/t2-temp-clone-document-patch.yml
          git commit -m 'fix: clone configuration document fields only'
          git push origin HEAD:feature/t2-client-storage-configuration-platform
