name: H05 source bootstrap

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/h05-image-derivatives
      - name: Expand reviewed H05 source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.h05-bundle-chunk-* > /tmp/h05.b64
          base64 -d /tmp/h05.b64 > /tmp/h05.tar.gz
          echo 'ad5f938de2b1898036bbec9880b9a31a889cae825de6c3a7364c31e75cc5fa51  /tmp/h05.tar.gz' | sha256sum -c -
          tar -xzf /tmp/h05.tar.gz
          rm -f scripts/.h05-bundle-chunk-* scripts/.h05-bundle-part-* scripts/.h05-trigger .github/workflows/h05-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement bounded image derivatives'
          git push origin HEAD:agent/h05-image-derivatives
