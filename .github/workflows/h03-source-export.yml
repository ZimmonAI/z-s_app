name: H03 diagnose implementation patch

on:
  push:
    branches:
      - agent/t2-h03-generic-runtime-routing

permissions:
  contents: write

jobs:
  diagnose-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/t2-h03-generic-runtime-routing
          fetch-depth: 0
      - name: Record diagnostic run
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '${{ github.run_id }}' > tmp/h03-apply-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/h03-apply-run-id.txt
          git commit -m 'chore: record H03 patch diagnostic [skip ci]'
          git push origin HEAD:agent/t2-h03-generic-runtime-routing
      - name: Print patch chunk integrity
        shell: bash
        run: |
          set -euo pipefail
          wc -c tmp/h03-patch/0*
          sha256sum tmp/h03-patch/0*
          cat tmp/h03-patch/0* | base64 -d > /tmp/h03.patch.gz
          sha256sum /tmp/h03.patch.gz
          gzip -t /tmp/h03.patch.gz
