name: H03 source export

on:
  push:
    branches:
      - agent/t2-h03-generic-runtime-routing

permissions:
  contents: write

jobs:
  export-source:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: agent/t2-h03-generic-runtime-routing
      - name: Archive source checkout
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=tmp -czf /tmp/z-s_app-h03-source.tgz .
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: z-s_app-h03-source
          path: /tmp/z-s_app-h03-source.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Publish run identifier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/h03-source.tgz.b64 tmp/h03-chunks
          mkdir -p tmp
          printf '%s\n' '${{ github.run_id }}' > tmp/h03-run-id.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A tmp
          git commit -m "chore: publish H03 source artifact run [skip ci]"
          git push origin HEAD:agent/t2-h03-generic-runtime-routing
