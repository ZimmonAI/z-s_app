name: H03 source export

on:
  push:
    branches:
      - agent/t2-h03-generic-runtime-routing

permissions:
  contents: write

jobs:
  export-source:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: agent/t2-h03-generic-runtime-routing
      - name: Commit one-shot source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          tar --exclude=.git --exclude=tmp/h03-source.tgz.b64 -czf /tmp/z-s_app-h03-source.tgz .
          base64 -w4096 /tmp/z-s_app-h03-source.tgz > tmp/h03-source.tgz.b64
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/h03-source.tgz.b64
          git commit -m "chore: export chunked H03 source [skip ci]"
          git push origin HEAD:agent/t2-h03-generic-runtime-routing
