name: H03 source export

on:
  push:
    branches:
      - agent/t2-h03-generic-runtime-routing

permissions:
  contents: write

jobs:
  export-source:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: agent/t2-h03-generic-runtime-routing
      - name: Commit one-shot source chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/h03-source.tgz.b64 tmp/h03-chunks
          mkdir -p tmp/h03-chunks
          tar --exclude=.git --exclude=tmp -czf /tmp/z-s_app-h03-source.tgz .
          base64 -w0 /tmp/z-s_app-h03-source.tgz | split -b 18000 -d -a 4 - tmp/h03-chunks/chunk-
          (cd tmp/h03-chunks && sha256sum chunk-* > manifest.sha256)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A tmp
          git commit -m "chore: export retrievable H03 source chunks [skip ci]"
          git push origin HEAD:agent/t2-h03-generic-runtime-routing
