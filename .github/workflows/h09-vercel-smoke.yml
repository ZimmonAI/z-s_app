name: T2 H09 Vercel R2-primary smoke

on:
  pull_request:
    paths:
      - '.github/workflows/h09-vercel-smoke.yml'
      - 'scripts/h09-vercel-smoke.mjs'
      - '.test_account'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run bounded H09 Vercel smoke
        run: node scripts/h09-vercel-smoke.mjs
