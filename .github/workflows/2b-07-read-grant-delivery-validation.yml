name: 2B-07 source bundle bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Verify and apply complete governed source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-2b07/part-{00..09} > /tmp/zs-changes.b64
          echo '59c20ffd08a9f53aa6d75f7ba54fd9b9b868c0ca0454dcf702ba27b171920a39  /tmp/zs-changes.b64' | sha256sum --check --strict
          base64 --decode /tmp/zs-changes.b64 > /tmp/zs-changes.tgz
          echo '816ca448952d604df142b247b6517cfe1139903d1af6d5c40f378c3554848543  /tmp/zs-changes.tgz' | sha256sum --check --strict
          tar -xzf /tmp/zs-changes.tgz -C .
          rm -rf .github/agent-2b07
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply complete 2B-07 source bundle'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
